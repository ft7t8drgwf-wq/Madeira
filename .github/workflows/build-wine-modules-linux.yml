# One-off: builds Wine builtin PE modules (ARM64EC) with build/wine-pe/build-modules.sh
# on a Linux runner and commits them to the farm on the branch that was pushed.
# Linux minutes cost far less than macOS ones; the DLL is the same either way.
name: Build Wine modules (Linux)

on:
  push:
    branches: [ claude/project-thread-varlxf ]
    paths: [ .github/workflows/build-wine-modules-linux.yml ]
  workflow_dispatch:
    inputs:
      modules:
        description: 'Modules under wine/dlls to build'
        default: 'wintypes'

permissions:
  contents: write

env:
  MODULES: ${{ inputs.modules || 'wintypes' }}
  MINGW_LINUX: llvm-mingw-20260421-ucrt-ubuntu-22.04-x86_64
  MINGW_LINUX_SHA256: f8b8cce779affeab47bcaec6ce6e9e768b166094a366123ef64b2d0b389cc121

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Wine submodule
        run: git submodule update --init --depth 1 wine
      - name: Host tools
        run: sudo apt-get update && sudo apt-get install -y flex bison libfreetype-dev
      - name: llvm-mingw
        run: |
          curl -fsSL -o /tmp/llvm-mingw.tar.xz \
            "https://github.com/mstorsjo/llvm-mingw/releases/download/20260421/${MINGW_LINUX}.tar.xz"
          echo "${MINGW_LINUX_SHA256}  /tmp/llvm-mingw.tar.xz" | sha256sum -c -
          mkdir -p toolchains
          tar -xJf /tmp/llvm-mingw.tar.xz -C toolchains
          # build-modules.sh names the macOS toolchain directory
          ln -s "$MINGW_LINUX" toolchains/llvm-mingw-20260421-ucrt-macos-universal
      - name: Build
        run: JOBS=$(nproc) build/wine-pe/build-modules.sh $MODULES
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add app/Madeira/arm64ec-windows
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "DLL farm: $MODULES built from the wine submodule [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
